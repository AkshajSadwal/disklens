name: DiskLens Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $appVersion = (Get-Content server/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) { throw "Tag v$tagVersion does not match server/package.json version $appVersion." }

      - name: Install server dependencies and run bounded tests
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Install frontend dependencies and build production UI
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare self-contained Windows application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageRoot = Join-Path $env:RUNNER_TEMP 'DiskLensPackage'
          ./scripts/windows/package-release.ps1 -OutputDirectory $packageRoot -Version $version
          "DISKLENS_PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DISKLENS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer executable
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not found.' }
          $output = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $compiler "/DAppVersion=$env:DISKLENS_VERSION" "/DPackageRoot=$env:DISKLENS_PACKAGE_ROOT" "/O$output" 'installers/windows/DiskLens.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/installer/DiskLens-Setup-*.exe
          fail_on_unmatched_files: true
